[project]
name = "astraproject"
version = "0.1.0"
description = "AA Video Builder — генерация демо-роликов из YAML-сценариев."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.6.0",
    "moviepy>=2.2.1",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "proglog>=0.1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "webdriver-manager>=4.0.2",
    "yandex-speechkit>=1.5.0",
]

[tool.uv.workspace]
members = [
    "src",
]
