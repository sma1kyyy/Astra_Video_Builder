[project]
name = "astraproject"
version = "0.1.0"
description = "AA Video Builder — генерация демо-роликов из YAML-сценариев."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "redis>=6.0.0",
    "celery>=5.5.3",
    "audioop-lts>=0.2.2",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.6.0",
    "moviepy>=2.2.1",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "proglog>=0.1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "webdriver-manager>=4.0.2",
    "yandex-speechkit>=1.5.0",
    "openai>=1.0",
    "sse-starlette>=2.0",
    "slowapi>=0.1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv.workspace]
members = [
    "src",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
