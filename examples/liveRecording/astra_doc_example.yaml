metadata:
  title: Astra_Automation_Overview
  resolution: 1920x1080
  mode: live
  fps: 30
  cursor: true
  save_files: false

acts:
  act_1:
    name: Обзор главной страницы
    scenes:
      scene_1:
        name: Главный экран
        actions:
          action_1:
            type: navigate
            url: https://astra-automation.ru/
          action_2:
            type: wait
            duration: 5

      scene_2:
        name: Блок преимуществ
        actions:
          action_1:
            type: scrollTo
            selector: //div[@class='advantages-block']
            behavior: smooth
          action_2:
            type: wait
            duration: 5

      scene_3:
        name: Блок сценариев применения
        actions:
          action_1:
            type: scrollTo
            selector: //div[@class='scenaries-block']
            behavior: smooth
          action_2:
            type: wait
            duration: 5

      scene_4:
        name: Блок методов установки
        actions:
          action_1:
            type: scrollTo
            selector: //div[@class='methods-block']
            behavior: smooth
          action_2:
            type: wait
            duration: 5

      scene_5:
        name: Блок обратной связи
        actions:
          action_1:
            type: scrollTo
            selector: //div[@class='feedback_block']
            behavior: smooth
          action_2:
            type: wait
            duration: 5
