# CI/CD pipeline для AA Video Builder.
# Триггерится на push в любую ветку и на merge requests.

image: python:3.13-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: .uv-cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  key: uv-py313
  paths:
    - .uv-cache
    - .venv

before_script:
  - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates ffmpeg
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync --group dev

lint:syntax:
  stage: lint
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run python -m compileall -q core engines main.py
    - uv run python -c "import main; print('main importable')"

test:unit:
  stage: test
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run pytest tests/ -v --tb=short
  artifacts:
    when: always
    paths:
      - .pytest_cache
    expire_in: 1 week
