# CI/CD конфигурация для проекта генерации демонстрационных роликов
# Используется Go-образ как универсальный CI-раннер
# Основной код проекта реализован на Python

image: golang:1.22

stages:
  - test
  - build

test:
  stage: test
  script:
    - 'echo CI stage test'
    - 'go version'
    - 'echo Проверка структуры проекта'
    - 'test -d src'
    - 'test -f src/main.py'
    - 'test -d scripts'

build:
  stage: build
  script:
    - 'echo CI stage build'
    - 'echo Сборка не требуется на этапе MVP'
