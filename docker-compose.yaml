version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: aa_video_builder_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: aa_video_builder_worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AA_LOG_LEVEL: INFO
    volumes:
      - ./:/app
    working_dir: /app
    command: celery -A core.queue.tasks worker --loglevel=info
